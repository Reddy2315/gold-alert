<!doctype html>
<html>
  <head>
    <title>Login | GoldAlert</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="d-flex align-items-center justify-content-center">
    <div class="card p-4" style="width: 380px">
      <h3 class="text-center brand-gradient fw-bold mb-3">GoldAlert</h3>
      <p class="text-center text-muted">Login to your account</p>

      <!-- FORM WRAPPER -->
      <form onsubmit="handleLogin(event)">
        <input
          id="email"
          class="form-control mb-3"
          placeholder="Email"
          oninput="saveFormValue('login_email', this.value)"
          required
        />

        <input
          id="password"
          type="password"
          class="form-control mb-3"
          placeholder="Password"
          oninput="saveFormValue('login_password', this.value)"
          required
        />

        <!-- type="submit" -->
        <button type="submit" class="btn btn-gold w-100">
          Login
        </button>
      </form>

      <p class="text-center mt-3">
        New user? <a href="register.html">Create account</a>
      </p>
    </div>

    <!-- GLOBAL TOAST CONTAINER -->
    <div
      class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"
      style="z-index: 9999"
    >
      <div
        id="appToast"
        class="toast align-items-center text-bg-success border-50"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">Success message</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
