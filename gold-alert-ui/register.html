<!doctype html>
<html>
  <head>
    <title>Register | GoldAlert</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="d-flex align-items-center justify-content-center">
    <div class="card p-4" style="width: 380px">
      <h3 class="text-center brand-gradient fw-bold mb-3">Create Account</h3>
      <p class="text-center text-muted">Start tracking gold prices</p>

      <form onsubmit="handleRegister(event)" onreset="handleRegisterReset()">
        <input
          id="email"
          class="form-control mb-3"
          placeholder="Email"
          oninput="saveFormValue('register_email', this.value)"
        />
        <input
          id="password"
          type="password"
          class="form-control mb-3"
          placeholder="Password"
          oninput="saveFormValue('register_password', this.value)"
        />
        <input
          id="confirmPassword"
          type="password"
          class="form-control mb-3"
          placeholder="Confirm Password"
          oninput="saveFormValue('register_confirm_password', this.value);onConfirmPasswordInput();"
        />
        
        <!-- Inline error message -->
        <div
          id="confirmPasswordError"
          class="text-danger small d-none mb-3"
        >
          Passwords do not match
        </div>

        <button id="registerBtn" type="submit" class="btn btn-gold w-100 mb-2 d-flex align-items-center justify-content-center gap-2">
          Register
        </button>
        <button type="reset" class="btn btn-outline-secondary w-100 mb-2">
          Reset
        </button>
      </form>

      <p class="text-center mt-3">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>

    <!-- GLOBAL TOAST CONTAINER -->
    <div
      class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"
      style="z-index: 9999"
    >
      <div
        id="appToast"
        class="toast align-items-center text-bg-success border-50"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">Success message</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
