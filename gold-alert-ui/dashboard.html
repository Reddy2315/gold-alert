<!doctype html>
<html>
  <head>
    <title>Dashboard | GoldAlert</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body onload="loadLayout()">
    <div id="navbar"></div>

    <div class="container mt-5">
      <!-- CREATE ALERT -->
      <div class="card p-4 mb-4">
        <h5>Create Gold Alert</h5>
        <p class="text-muted">Notify me when gold price drops to</p>

        <div class="d-flex gap-2">
          <input
            id="price"
            class="form-control"
            placeholder="Target price (₹ / gram)"
          />
          <!-- <button class="btn btn-gold" onclick="createAlert()">Create</button> -->
           <button class="btn btn-warning w-100 mb-1" onclick="createAlert()">Create Alert</button>
           <button class="btn btn-secondary w-100 mb-1" onclick="fetchPrice()">Fetch Price Now</button>
        </div>
      </div>

      <!-- ALERT LIST -->
      <div class="card p-4 mb-4">
        <h5>Your Alerts</h5>
        <table class="table mt-3">
          <thead>
            <tr>
              <th>Target Price</th>
              <th>Status</th>
              <th>Triggered At</th>
            </tr>
          </thead>
          <tbody id="alertTable"></tbody>
        </table>
      </div>

      <!-- PRICE HISTORY -->
      <div class="card p-4">
        <h5>Gold Price History</h5>
        <table class="table mt-3">
          <thead>
            <tr>
              <th>Price (₹)</th>
              <th>Source</th>
              <th>Fetched At</th>
            </tr>
          </thead>
          <tbody id="priceTable"></tbody>
        </table>
      </div>
    </div>

    <!-- GLOBAL TOAST CONTAINER -->
    <div
      class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"
      style="z-index: 9999"
    >
      <div
        id="appToast"
        class="toast align-items-center text-bg-success border-50"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">Success message</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <div id="footer"></div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/alerts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/toast.js"></script>
  </body>
</html>
