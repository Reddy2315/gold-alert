server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gold-alert

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000


gold:
  api:
    url: ${GOLD_API_BASE_URL}
    key: ${GOLD_API_KEY}

# Twilio configuration for WhatsApp notifications later
twilio:
  accountSid: YOUR_TWILIO_SID
  authToken: YOUR_TWILIO_AUTH_TOKEN
  whatsappFrom: "whatsapp:+14155238886" # Twilio sandbox number