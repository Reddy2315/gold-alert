server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gold-alert

  datasource:
    url: jdbc:postgresql://localhost:5432/gold_alert
    username: postgres
    password: pass@word1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: "THIS_IS_A_256_BIT_SECRET_KEY_FOR_GOLD_ALERT_APP"
  expiration: 3600000


gold:
  api:
    url: https://api.metals.dev/v1/latest
    key: YOUR_REAL_API_KEY

twilio:
  accountSid: YOUR_TWILIO_SID
  authToken: YOUR_TWILIO_AUTH_TOKEN
  whatsappFrom: "whatsapp:+14155238886" # Twilio sandbox number